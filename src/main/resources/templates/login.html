<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cobro Móvil Rewards — Iniciar sesión</title>

  <!-- CSS externo -->
  <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>

<div class="login-page">
  <!-- Contenedor principal con fondo #E5FAF7 como en React -->
  <div class="login-container" style="background-color: #E5FAF7;">
    
    <!-- Logo - Con animación y posición similar a React -->
    <div class="logo-wrapper fade-down">
      <img 
        th:src="@{/images/feature_logo.png}"
        src="https://placehold.co/400x100/transparent/transparent?text=Logo"
        alt="Cobro Móvil Rewards"
        class="feature-logo"
      />
    </div>

    <!-- Hero Person - Con animación de escala similar a React -->
    <div class="hero-wrapper scale-animation">
      <img 
        th:src="@{/images/hero-person.png}"
        src="https://placehold.co/300x400/transparent/transparent?text=Hero"
        alt="Cobro Móvil Rewards"
        class="hero-person"
      />
    </div>

    <!-- Área inferior con SVG de fondo y formulario -->
    <div class="bottom-area">
      
      <!-- Bottom Area SVG de fondo -->
      <div class="bottom-svg">
        <img 
          th:src="@{/images/bottom_area.svg}"
          src="https://placehold.co/600x400/transparent/transparent?text=SVG"
          alt=""
          class="bottom-wave"
        />
      </div>

      <!-- Formulario de login -->
      <form th:action="@{/login}" method="post" class="login-form fade-up">
        
        <!-- Mensajes de error y logout -->
        <div class="alert-error" th:if="${param.error}" role="alert">
          Correo o contraseña incorrectos. Por favor intenta de nuevo.
        </div>
        
        <div class="alert-success" th:if="${param.logout}" role="status">
          Has cerrado sesión correctamente.
        </div>

        <!-- Campo de correo electrónico -->
        <div class="input-field">
          <input 
            type="email" 
            id="username" 
            name="username" 
            placeholder="Correo Electrónico"
            required
            autocomplete="email"
          />
        </div>

        <!-- Campo de contraseña -->
        <div class="input-field">
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="Contraseña"
            required
            autocomplete="current-password"
          />
        </div>

        <!-- Botón de inicio de sesión -->
        <div class="button-wrapper">
          <button type="submit" class="btn-login">
            Iniciar sesión
          </button>
        </div>

        <!-- Enlaces secundarios (similar a React) 
        <div class="form-footer">
          <div class="register-link">
            ¿No tienes cuenta? 
            <a th:href="@{/register}" class="register-link-btn">
              Regístrate aquí
            </a>
          </div>
          <p class="terms-text">
            Al iniciar sesión, aceptas los 
            <a href="#" class="terms-link" th:href="@{/terminos-y-condiciones}">
              Términos y Condiciones
            </a> 
            y el 
            <a href="#" class="terms-link" th:href="@{/aviso-de-privacidad}">
              Aviso de Privacidad
            </a>
          </p>
        </div>
        -->
      </form>
    </div>
  </div>
</div>

</body>
</html>
